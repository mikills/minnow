name: DuckDB huge-page attribution

on:
  pull_request:
    paths:
      - 'scripts/thp_*'
      - scripts/duckdb_profile/main.go
      - 'scripts/duckdb_profile/memory_*'
      - .github/workflows/duckdb-memory.yml
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Baseline ref with DuckDB 1.5.0'
        required: true
        default: main
      performance_only:
        description: 'Compare actual 2.0 simulations and warm queries under default versus disabled THP'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: duckdb-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    if: ${{ !inputs.performance_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 384MiB
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: candidate/go.mod
          cache-dependency-path: |
            baseline/go.sum
            candidate/go.sum
      - name: Check tooling and record host policy
        run: |
          python3 -m unittest discover -s candidate/scripts -p '*duckdb_test.py' -v
          mkdir -p thp
          uname -a > thp/host.txt
          lscpu >> thp/host.txt
          free -m >> thp/host.txt
          go version >> thp/host.txt
          cat /sys/kernel/mm/transparent_hugepage/enabled >> thp/host.txt
          cat /sys/kernel/mm/transparent_hugepage/defrag >> thp/host.txt
          getconf PAGESIZE >> thp/host.txt
          cc -O2 -Wall -Wextra -Werror candidate/scripts/thp_exec.c -o thp/thp-exec
      - name: Build identical probes against both released engines
        run: |
          set -euo pipefail
          for revision in baseline candidate; do
            (
              cd "$revision"
              git rev-parse HEAD > "../thp/$revision.sha"
              go list -m all > "../thp/$revision.modules.txt"
              go build -p=1 -o "$GITHUB_WORKSPACE/thp/$revision-profile" \
                "$GITHUB_WORKSPACE/candidate/scripts/duckdb_profile/main.go" \
                "$GITHUB_WORKSPACE/candidate/scripts/duckdb_profile/query_split.go" \
                "$GITHUB_WORKSPACE/candidate/scripts/duckdb_profile/memory_attribution.go" \
                "$GITHUB_WORKSPACE/candidate/scripts/duckdb_profile/memory_linux.go"
              go build -p=1 -o "$GITHUB_WORKSPACE/thp/$revision-probe" \
                "$GITHUB_WORKSPACE/candidate/scripts/duckdb_compat/main.go"
              "../thp/$revision-probe" > "../thp/$revision.engine.json"
              sha256sum "../thp/$revision-profile" > "../thp/$revision.binary.sha256"
            )
          done
          (cd baseline/extensions/v1.5.0/linux_amd64 && sha256sum *.duckdb_extension) > thp/baseline.extensions.sha256
          (cd candidate/extensions/v2.0.0 && sha256sum -c SHA256SUMS)
          (cd candidate/extensions/v2.0.0/linux_amd64 && sha256sum *.duckdb_extension) > thp/candidate.extensions.sha256
          (cd candidate && go test -p=1 -parallel=1 -timeout=1m -run '^TestMemory$' ./scripts/duckdb_profile)
      - name: Compare process THP policies in fresh sequential processes
        run: python3 candidate/scripts/thp_duckdb.py --root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duckdb-thp
          retention-days: 7
          path: |
            thp/*.json
            thp/*.txt
            thp/*.md
            thp/*.sha
            thp/*.sha256
            thp/*.out
            thp/*.err
          if-no-files-found: warn

  performance:
    if: ${{ inputs.performance_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 384MiB
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: candidate/go.mod
          cache-dependency-path: candidate/go.sum
      - name: Check tooling and record host policy
        run: |
          python3 -m unittest discover -s candidate/scripts -p '*duckdb_test.py' -v
          mkdir -p results
          uname -a > results/host.txt
          lscpu >> results/host.txt
          free -m >> results/host.txt
          go version >> results/host.txt
          cat /sys/kernel/mm/transparent_hugepage/enabled >> results/host.txt
          cat /sys/kernel/mm/transparent_hugepage/defrag >> results/host.txt
          cc -O2 -Wall -Wextra -Werror candidate/scripts/thp_exec.c -o results/thp-exec
          cc -O2 -Wall -Wextra -Werror candidate/deploy/linux/minnow-exec.c -o results/minnow-exec
          python3 candidate/scripts/thp_launcher_test.py -v
      - name: Compile application workloads once, outside measurement
        working-directory: candidate
        run: |
          set -euo pipefail
          git rev-parse HEAD > ../results/candidate.sha
          cp ../results/candidate.sha ../results/baseline.sha
          go list -m all > ../results/candidate.modules.txt
          go test -p=1 -c -o "$GITHUB_WORKSPACE/results/candidate.test" ./sim
          go test -p=1 -c -o "$GITHUB_WORKSPACE/results/candidate-query.test" ./kb/duckdb
          go build -p=1 -o "$GITHUB_WORKSPACE/results/candidate-probe" ./scripts/duckdb_compat
          ../results/candidate-probe -expect v2.0.0 > ../results/candidate.engine.json
          cp ../results/candidate.engine.json ../results/baseline.engine.json
          (cd extensions/v2.0.0 && sha256sum -c SHA256SUMS)
          go test -p=1 -parallel=1 -count=1 -run '^(TestRuntime|TestExtensions|TestAppender)$' \
            ./kb/duckdb ./kb/duckdb/internal/connection
          sha256sum ../results/candidate.test ../results/candidate-query.test \
            ../results/minnow-exec ../results/thp-exec > ../results/binaries.sha256
      - name: Compare application costs under each THP policy
        run: |
          set -euo pipefail
          group=/sys/fs/cgroup/minnow-thp-performance
          sudo mkdir "$group"
          echo '+memory' | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null
          echo $((2 * 1024 * 1024 * 1024)) | sudo tee "$group/memory.max" > /dev/null
          echo 0 | sudo tee "$group/memory.swap.max" > /dev/null
          for file in memory.max memory.high memory.swap.max memory.events; do
            echo "$file" >> results/cgroup.before.txt
            cat "$group/$file" >> results/cgroup.before.txt
          done
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_STEP_SUMMARY,GITHUB_WORKSPACE,GOMAXPROCS,GOMEMLIMIT,GOWORK,PYTHONDONTWRITEBYTECODE sh -ec '
            echo $$ > /sys/fs/cgroup/minnow-thp-performance/cgroup.procs
            exec setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups \
              python3 "$GITHUB_WORKSPACE/candidate/scripts/compare_duckdb.py" \
                --root "$GITHUB_WORKSPACE" --same-engine --queries --thp \
                --cgroup /sys/fs/cgroup/minnow-thp-performance
          '
      - name: Record cgroup memory evidence
        if: always()
        run: |
          group=/sys/fs/cgroup/minnow-thp-performance
          if [ -d "$group" ]; then
            for file in memory.max memory.high memory.swap.max memory.current memory.peak memory.swap.current memory.events memory.pressure; do
              echo "$file" >> results/cgroup.after.txt
              cat "$group/$file" >> results/cgroup.after.txt
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duckdb-thp-performance
          retention-days: 7
          path: |
            results/*.json
            results/*.txt
            results/*.md
            results/*.sha
            results/*.sha256
            results/*.time
            results/*.log
          if-no-files-found: warn
